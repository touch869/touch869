  <rect x="0.5" y="0.5" width="459" height="189" rx="6" fill="#0d1117" stroke="#30363d"/><text x="30" y="42" class="title">GitHub Stats</text><circle cx="23" cy="80" r="4" fill="#1f6feb"/>
